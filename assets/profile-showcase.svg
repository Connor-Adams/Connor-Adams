<svg width="920" height="1680" viewBox="0 0 920 1680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Connor Adams — design-focused product engineer</title>
  <desc id="desc">A cohesive portfolio-style GitHub profile for Connor Adams, focused on product craft, polished interfaces, full-stack systems, automation, selected work, stack, and operating philosophy.</desc>

