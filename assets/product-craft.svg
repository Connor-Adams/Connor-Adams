<svg width="920" height="360" viewBox="0 0 920 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Product craft dashboard</title>
  <desc id="desc">A visual widget showing Connor Adams' emphasis on visual product quality, interaction design, data clarity, systems polish, and product feel.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="920" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.52" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="360" rx="28" fill="url(#hero)"/>
  <rect x="1" y="1" width="918" height="358" rx="27" stroke="#334155"/>

  <circle cx="790" cy="-20" r="190" fill="#7C3AED" opacity="0.18"/>
  <circle cx="130" cy="360" r="190" fill="#10B981" opacity="0.12"/>

  <text x="40" y="60" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="800">Product craft matters</text>
  <text x="40" y="88" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="14">I care about the visual layer: hierarchy, interaction, clarity, motion, polish, and whether the thing feels good to use.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="122" width="250" height="170" rx="22" fill="#0F172A" stroke="#334155"/>
    <rect x="64" y="146" width="206" height="18" rx="9" fill="url(#amber)"/>
    <rect x="64" y="182" width="136" height="12" rx="6" fill="#475569"/>
    <rect x="64" y="207" width="184" height="12" rx="6" fill="#334155"/>
    <rect x="64" y="232" width="156" height="12" rx="6" fill="#334155"/>
    <rect x="64" y="258" width="82" height="22" rx="11" fill="#F59E0B"/>
    <text x="78" y="273" fill="#111827" font-family="Inter, ui-sans-serif, system-ui" font-size="11" font-weight="800">CLEAR CTA</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="335" y="122" width="250" height="170" rx="22" fill="#0F172A" stroke="#334155"/>
    <path d="M364 247 C394 202, 420 232, 449 188 C479 143, 510 180, 555 148" stroke="url(#jade)" stroke-width="5" stroke-linecap="round"/>
    <rect x="364" y="258" width="44" height="10" rx="5" fill="#334155"/>
    <rect x="426" y="258" width="44" height="10" rx="5" fill="#334155"/>
    <rect x="488" y="258" width="44" height="10" rx="5" fill="#334155"/>
    <circle cx="449" cy="188" r="8" fill="#34D399"/>
    <text x="363" y="157" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="800">Data should explain itself</text>
    <text x="363" y="180" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Not just charts. Decisions.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="628" y="122" width="250" height="170" rx="22" fill="#0F172A" stroke="#334155"/>
    <rect x="654" y="151" width="198" height="112" rx="18" fill="#111827" stroke="#475569"/>
    <circle cx="681" cy="180" r="13" fill="url(#plum)"/>
    <rect x="710" y="170" width="96" height="10" rx="5" fill="#64748B"/>
    <rect x="710" y="190" width="120" height="10" rx="5" fill="#334155"/>
    <rect x="675" y="224" width="70" height="22" rx="11" fill="#7C3AED"/>
    <rect x="756" y="224" width="70" height="22" rx="11" fill="#1E293B" stroke="#475569"/>
    <text x="656" y="286" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Useful, calm, fast, obvious.</text>
  </g>

  <g transform="translate(40 318)">
    <circle cx="8" cy="0" r="5" fill="#F59E0B"/>
    <text x="22" y="5" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Visual hierarchy</text>
    <circle cx="158" cy="0" r="5" fill="#7C3AED"/>
    <text x="172" y="5" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Interaction polish</text>
    <circle cx="322" cy="0" r="5" fill="#10B981"/>
    <text x="336" y="5" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Data clarity</text>
    <circle cx="448" cy="0" r="5" fill="#38BDF8"/>
    <text x="462" y="5" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Product feel</text>
  </g>
</svg>
