<svg width="920" height="390" viewBox="0 0 920 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Connor Adams hero banner</title>
  <desc id="desc">Hero banner for Connor Adams, product engineer focused on polished interfaces, full-stack systems, automation, and visual product craft.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.45" stop-color="#20113D"/>
      <stop offset="1" stop-color="#071B22"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(736 76) rotate(126) scale(306 220)">
      <stop stop-color="#F59E0B" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(159 347) rotate(-41) scale(310 230)">
      <stop stop-color="#10B981" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(423 24) rotate(90) scale(250 360)">
      <stop stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="920" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="pillA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F59E0B"/><stop offset="1" stop-color="#F97316"/></linearGradient>
    <linearGradient id="pillB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="pillC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34D399"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="390" rx="32" fill="url(#bg)"/>
  <rect width="920" height="390" rx="32" fill="url(#glow1)"/>
  <rect width="920" height="390" rx="32" fill="url(#glow2)"/>
  <rect width="920" height="390" rx="32" fill="url(#glow3)"/>
  <rect x="1.2" y="1.2" width="917.6" height="387.6" rx="30.8" stroke="url(#stroke)" stroke-width="2.4" opacity="0.75"/>

  <g opacity="0.22">
    <path d="M38 320 C168 260, 232 344, 360 276 C468 218, 540 232, 654 146 C748 76, 824 86, 900 48" stroke="#F8FAFC" stroke-width="1.5"/>
    <path d="M40 344 C202 284, 286 374, 430 296 C530 242, 608 258, 744 176 C802 142, 856 124, 900 112" stroke="#F8FAFC" stroke-width="1"/>
  </g>

  <g transform="translate(50 50)">
    <text x="0" y="42" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="44" font-weight="900" letter-spacing="-1.4">Connor Adams</text>
    <text x="0" y="82" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650">Product engineer.</text>
    <text x="0" y="109" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650">Polished interfaces. Durable systems.</text>
    <text x="0" y="136" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="650">Automation that removes operational pain.</text>

    <g transform="translate(0 176)">
      <rect width="186" height="38" rx="19" fill="url(#pillA)"/>
      <text x="93" y="25" text-anchor="middle" fill="#111827" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="900">VISUAL PRODUCT CRAFT</text>
    </g>
    <g transform="translate(202 176)">
      <rect width="174" height="38" rx="19" fill="url(#pillB)"/>
      <text x="87" y="25" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="900">FULL-STACK SYSTEMS</text>
    </g>
    <g transform="translate(392 176)">
      <rect width="132" height="38" rx="19" fill="url(#pillC)"/>
      <text x="66" y="25" text-anchor="middle" fill="#052E16" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="900">AUTOMATION</text>
    </g>

    <text x="0" y="265" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="850">Database shape → button placement.</text>
    <text x="0" y="294" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Clear hierarchy. Useful data. Fast interactions. Systems that explain themselves.</text>
  </g>

  <g filter="url(#blurShadow)" transform="translate(658 114)">
    <rect width="208" height="188" rx="28" fill="#0F172A" stroke="#334155"/>
    <rect x="24" y="24" width="160" height="28" rx="14" fill="#1E293B"/>
    <rect x="24" y="72" width="84" height="84" rx="22" fill="#111827" stroke="#334155"/>
    <path d="M44 130 C62 98, 82 122, 102 88" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
    <rect x="126" y="78" width="44" height="10" rx="5" fill="#F59E0B"/>
    <rect x="126" y="100" width="32" height="10" rx="5" fill="#7C3AED"/>
    <rect x="126" y="122" width="52" height="10" rx="5" fill="#10B981"/>
    <rect x="24" y="168" width="160" height="10" rx="5" fill="#334155"/>
  </g>
</svg>
