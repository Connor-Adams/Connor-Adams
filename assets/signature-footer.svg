<svg width="920" height="210" viewBox="0 0 920 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Operating philosophy footer</title>
  <desc id="desc">A visual footer summarizing Connor Adams' operating philosophy: build the root fix, improve product clarity, and make systems explain themselves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.45" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#082F2A"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="920" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="920" height="210" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="918" height="208" rx="27" stroke="url(#stroke)" opacity="0.75"/>

  <circle cx="92" cy="105" r="48" fill="#F59E0B" opacity="0.12"/>
  <circle cx="828" cy="105" r="58" fill="#10B981" opacity="0.12"/>
  <path d="M96 106 C212 54, 304 160, 428 102 C538 50, 632 142, 820 76" stroke="#F8FAFC" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round"/>
  <path d="M96 132 C226 80, 318 186, 448 128 C558 76, 656 168, 820 102" stroke="#F8FAFC" stroke-opacity="0.10" stroke-width="2" stroke-linecap="round"/>

  <text x="70" y="76" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="900">Build the root fix, not the band-aid.</text>
  <text x="70" y="112" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Make the product easier to operate. Make the interface easier to understand.</text>
  <text x="70" y="138" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Make the next bug less likely. Make the system explain itself.</text>

  <g transform="translate(702 68)">
    <rect width="148" height="74" rx="22" fill="#0B1020" stroke="#334155"/>
    <text x="74" y="32" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="850">Product + Systems</text>
    <text x="74" y="54" text-anchor="middle" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui" font-size="12">tasteful, useful, durable</text>
  </g>
</svg>
