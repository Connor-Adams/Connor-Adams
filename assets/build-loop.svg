<svg width="920" height="230" viewBox="0 0 920 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Build loop</title>
  <desc id="desc">A product engineering loop: understand, design, ship, instrument, automate, refine.</desc>
  <rect width="920" height="230" rx="24" fill="#0D1117"/>
  <rect x="1" y="1" width="918" height="228" rx="23" stroke="#30363D"/>

  <text x="40" y="55" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">How I like to build</text>
  <text x="40" y="82" fill="#8B949E" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Start with the pain, ship the product, then harden the system around it.</text>

  <g transform="translate(48 122)">
    <rect width="120" height="54" rx="16" fill="#161B22" stroke="#30363D"/>
    <text x="60" y="25" text-anchor="middle" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="800">Understand</text>
    <text x="60" y="42" text-anchor="middle" fill="#8B949E" font-family="Inter, ui-sans-serif, system-ui" font-size="10">real failure mode</text>
  </g>
  <path d="M180 149 H238" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M232 141 L240 149 L232 157" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(248 122)">
    <rect width="120" height="54" rx="16" fill="#161B22" stroke="#30363D"/>
    <text x="60" y="25" text-anchor="middle" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="800">Design</text>
    <text x="60" y="42" text-anchor="middle" fill="#8B949E" font-family="Inter, ui-sans-serif, system-ui" font-size="10">clear product path</text>
  </g>
  <path d="M380 149 H438" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M432 141 L440 149 L432 157" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(448 122)">
    <rect width="120" height="54" rx="16" fill="#161B22" stroke="#30363D"/>
    <text x="60" y="25" text-anchor="middle" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="800">Ship</text>
    <text x="60" y="42" text-anchor="middle" fill="#8B949E" font-family="Inter, ui-sans-serif, system-ui" font-size="10">fast and usable</text>
  </g>
  <path d="M580 149 H638" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  <path d="M632 141 L640 149 L632 157" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(648 122)">
    <rect width="120" height="54" rx="16" fill="#161B22" stroke="#30363D"/>
    <text x="60" y="25" text-anchor="middle" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="800">Instrument</text>
    <text x="60" y="42" text-anchor="middle" fill="#8B949E" font-family="Inter, ui-sans-serif, system-ui" font-size="10">observe the system</text>
  </g>

  <g transform="translate(790 122)">
    <rect width="90" height="54" rx="16" fill="#1E1B4B" stroke="#7C3AED"/>
    <text x="45" y="25" text-anchor="middle" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="800">Refine</text>
    <text x="45" y="42" text-anchor="middle" fill="#C4B5FD" font-family="Inter, ui-sans-serif, system-ui" font-size="10">make it stick</text>
  </g>
</svg>
