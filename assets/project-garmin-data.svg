<svg width="440" height="190" viewBox="0 0 440 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Garmin/Data project card</title>
  <desc id="desc">Garmin/Data: turning raw health, fitness, glucose, and activity signals into readable product surfaces.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="440" y2="190"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#082F49"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/></filter></defs>
  <rect width="440" height="190" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="438" height="188" rx="23" stroke="#164E63"/><circle cx="386" cy="34" r="96" fill="#38BDF8" opacity="0.11"/>
  <g filter="url(#shadow)"><rect x="28" y="34" width="58" height="58" rx="18" fill="url(#accent)"/><text x="57" y="72" text-anchor="middle" fill="#ECFEFF" font-family="Inter, ui-sans-serif, system-ui" font-size="28" font-weight="900">⌁</text></g>
  <text x="108" y="54" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="900">Garmin / Data</text>
  <text x="108" y="82" fill="#A7B0BE" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Readable personal data surfaces.</text>
  <text x="108" y="105" fill="#7D8794" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Health, fitness, glucose, activity, and signals.</text>
  <rect x="28" y="132" width="82" height="28" rx="14" fill="#0C4A6E" stroke="#0369A1"/><text x="69" y="151" text-anchor="middle" fill="#BAE6FD" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="800">Health</text>
  <rect x="120" y="132" width="108" height="28" rx="14" fill="#111827" stroke="#334155"/><text x="174" y="151" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="800">Dashboards</text>
  <rect x="238" y="132" width="88" height="28" rx="14" fill="#111827" stroke="#334155"/><text x="282" y="151" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="800">Signals</text>
