<svg width="920" height="260" viewBox="0 0 920 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack</title>
  <desc id="desc">A uniform technology stack widget for TypeScript, React, Node.js, Swift, PostgreSQL, Supabase, Prisma, Tailwind, Next.js, Vite, GitHub Actions, Railway, Vercel, and Cloudflare.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="920" height="260" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="918" height="258" rx="27" stroke="#30363D"/>
  <rect x="40" y="72" width="840" height="2" rx="1" fill="url(#accent)" opacity="0.9"/>
  <text x="40" y="50" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui" font-size="28" font-weight="850">Stack I reach for</text>
  <text x="40" y="100" fill="#8B949E" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Modern product surfaces, reliable backends, clean delivery, and enough infra to make it all stick.</text>

  <g font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="800">
    <g transform="translate(40 130)"><rect width="112" height="34" rx="17" fill="#111827" stroke="#334155"/><text x="56" y="22" text-anchor="middle" fill="#CBD5E1">TypeScript</text></g>
    <g transform="translate(164 130)"><rect width="82" height="34" rx="17" fill="#0C4A6E" stroke="#0369A1"/><text x="41" y="22" text-anchor="middle" fill="#BAE6FD">React</text></g>
    <g transform="translate(258 130)"><rect width="92" height="34" rx="17" fill="#052E16" stroke="#166534"/><text x="46" y="22" text-anchor="middle" fill="#86EFAC">Node.js</text></g>
    <g transform="translate(362 130)"><rect width="80" height="34" rx="17" fill="#111827" stroke="#475569"/><text x="40" y="22" text-anchor="middle" fill="#E2E8F0">Swift</text></g>
    <g transform="translate(454 130)"><rect width="118" height="34" rx="17" fill="#111827" stroke="#334155"/><text x="59" y="22" text-anchor="middle" fill="#CBD5E1">PostgreSQL</text></g>
    <g transform="translate(584 130)"><rect width="102" height="34" rx="17" fill="#052E16" stroke="#166534"/><text x="51" y="22" text-anchor="middle" fill="#86EFAC">Supabase</text></g>
    <g transform="translate(698 130)"><rect width="84" height="34" rx="17" fill="#111827" stroke="#334155"/><text x="42" y="22" text-anchor="middle" fill="#CBD5E1">Prisma</text></g>
    <g transform="translate(794 130)"><rect width="86" height="34" rx="17" fill="#082F49" stroke="#0E7490"/><text x="43" y="22" text-anchor="middle" fill="#A5F3FC">Tailwind</text></g>

    <g transform="translate(40 184)"><rect width="82" height="34" rx="17" fill="#111827" stroke="#334155"/><text x="41" y="22" text-anchor="middle" fill="#CBD5E1">Next.js</text></g>
    <g transform="translate(134 184)"><rect width="70" height="34" rx="17" fill="#431407" stroke="#9A3412"/><text x="35" y="22" text-anchor="middle" fill="#FDBA74">Vite</text></g>
    <g transform="translate(216 184)"><rect width="134" height="34" rx="17" fill="#111827" stroke="#334155"/><text x="67" y="22" text-anchor="middle" fill="#CBD5E1">GitHub Actions</text></g>
    <g transform="translate(362 184)"><rect width="86" height="34" rx="17" fill="#1E1B4B" stroke="#7C3AED"/><text x="43" y="22" text-anchor="middle" fill="#DDD6FE">Railway</text></g>
    <g transform="translate(460 184)"><rect width="74" height="34" rx="17" fill="#111827" stroke="#334155"/><text x="37" y="22" text-anchor="middle" fill="#CBD5E1">Vercel</text></g>
    <g transform="translate(546 184)"><rect width="104" height="34" rx="17" fill="#431407" stroke="#F59E0B"/><text x="52" y="22" text-anchor="middle" fill="#FED7AA">Cloudflare</text></g>
  </g>
</svg>