<svg width="440" height="190" viewBox="0 0 440 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rainbot project card</title>
  <desc id="desc">Rainbot: Discord voice and audio orchestration system with a TypeScript monorepo, workers, and infrastructure.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="440" y2="190"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/></filter></defs>
  <rect width="440" height="190" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="438" height="188" rx="23" stroke="#3B2F68"/><circle cx="382" cy="34" r="96" fill="#7C3AED" opacity="0.13"/>
  <g filter="url(#shadow)"><rect x="28" y="34" width="58" height="58" rx="18" fill="url(#accent)"/><text x="57" y="72" text-anchor="middle" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui" font-size="28" font-weight="900">◎</text></g>
  <text x="108" y="54" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="900">Rainbot</text>
  <text x="108" y="82" fill="#A7B0BE" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Discord voice/audio orchestration.</text>
  <text x="108" y="105" fill="#7D8794" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Workers, monorepo, CI/CD, and infra.</text>
  <rect x="28" y="132" width="104" height="28" rx="14" fill="#111827" stroke="#334155"/><text x="80" y="151" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="800">Monorepo</text>
  <rect x="142" y="132" width="82" height="28" rx="14" fill="#1E1B4B" stroke="#7C3AED"/><text x="183" y="151" text-anchor="middle" fill="#DDD6FE" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="800">Audio</text>
  <rect x="234" y="132" width="72" height="28" rx="14" fill="#111827" stroke="#334155"/><text x="270" y="151" text-anchor="middle" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="800">Infra</text>
